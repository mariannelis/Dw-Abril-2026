<!DOCTYPE html>
<html lang='es'>

<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Dia 20: Formularios y repaso HTML </title>
  <link rel='icon' href='images/Aguila_2.0.webp' type='image/webp'>
  <link rel='stylesheet' href='css/main.css'>
  <script src="js/main.js"></script>
</head>

<body>
  <div class="contenedor">
  <div class="formulario contacto">
    <h2>Contacto</h2>

    <form>
      <input type="text" placeholder="Nombre" required>

      <input type="email" placeholder="Correo electrónico" required>

      <input type="tel" placeholder="Teléfono" required>

      <textarea placeholder="Escribe tu mensaje"></textarea>

      <button type="submit">Enviar</button>
    </form>
  </div>

<div class="formulario registro">
  <h2>Registro</h2>
  <form>
    <input type="text" placeholder="Nombre completo" required>

    <input type="text" placeholder="Nombre de usuario" required>

    <input type="email" placeholder="Correo electrónico" required>

    <input type="email" placeholder="Repetir correo electrónico" required>

    <input type="date" required>

    <button type="submit">Registrarse</button>
  </form>
</div>

<div class="formulario login">
  <h2>Iniciar Sesión</h2>

  <form>
    <input type="text" placeholder="Usuario o Email" required>

    <input type="password" placeholder="Contraseña" required>

    <button type="submit">Entrar</button>
  </form>

  <div class="extra">
    <p>¿Olvidaste tu contraseña?</p>
    <a href="#">Recuperarla</a>
  </div>
</div>
</div>

</body>

</html>
