<!DOCTYPE html>
<html lang='es'>

<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Dia 30 </title>
  <link rel='icon' href='images/Aguila_2.0.webp' type='image/webp'>
  <link rel='stylesheet' href='css/main.css'>
  <script src="js/main.js" defer></script>
</head>

<body>
  <header>
    <h1>DOM + Foreach</h1>
  </header>
  <main>
    <section class="container">
      <h2>Nivel 1: Interacción básica con el DOM y BOM</h2>
      <div class="botones">
        <button id="btnOpen">Open</button>
        <button id="btnClose">Close</button>
        <button id="btnMove">MoveTo</button>
        <button id="btnResize">ResizeTo</button>
      </div>
      <button id="btnLocation">Location</button>
    </section>

    <!-- nivel 2 -->
    <section class="container">
      <h2>Nivel 2: Manipulación dinámica de contenido</h2>
      <div class="contenedor-cajas">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
      </div>
      <button id="btnRandom">Cambiar Números</button>
    </section>

    <!-- nivel 3 Realiza una calculadora. Debe tener:
Dos <input type="number">
Un <select> con los operadores: +, -, *, /
Un botón para calcular. 
Al pulsar el botón, debe mostrar el resultado de la operación seleccionada -->

    <section class="container">
      <h2>Nivel 3: Calculadora básica</h2>
      <div class="calculadora">
        <input type="number" id="num1" placeholder="Número 1">
        <select id="operador">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="*">*</option>
          <option value="/">/</option>
        </select>
        <input type="number" id="num2" placeholder="Número 2">
      </div>
      <button id="btnCalcular">Calcular</button>
      <h3 id="resultado">Resultado: </h3>
    </section>
    <section class="containerfinal">
      <h2>Nivel 4: Ejercicios con querySelectorAll</h2>
      <!-- DIVS -->
      <div class="divResultado">Div 1</div>
      <div class="divResultado">Div 2</div>
      <div class="divResultado">Div 3</div>
      <!-- PARRAFOS -->
      <p>párrafo 1.</p>
      <p>párrafo 2.</p>
      <p>párrafo 3.</p>
      <!-- BOTONES -->
      <button class="btnNivel4">Botón 1</button>
      <button class="btnNivel4">Botón 2</button>
      <button class="btnNivel4">Botón 3</button>
    </section>
  </main>
</body>

</html>
